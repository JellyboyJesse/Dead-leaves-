name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      # A fixed debug key means every build is signed the same way,
      # so a new APK installs over the old one without uninstalling.
      - name: Use fixed debug key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk leaf-fall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: leaf-fall-apk
          path: leaf-fall.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: leaf-fall.apk
