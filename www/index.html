<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181817" media="(prefers-color-scheme: dark)">
  <title>Leaf Fall</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>Leaf Fall</h1>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </header>

    <section class="stage">
      <canvas id="scene" role="img" aria-label="Leaves hang from the canopy, fall in the wind and decay on the ground. Tap a leaf to drop it, or tap the sky for a gust."></canvas>
      <div class="transport">
        <button id="play" class="play" aria-pressed="false" aria-label="Play">
          <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z"/></svg>
          <svg class="i-stop" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg>
          <span class="play-label">Play</span>
        </button>
        <div class="tools">
          <button id="record" class="tool rec" title="Record what you hear" aria-label="Record" aria-pressed="false">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="5"/></svg>
            <span id="rec-label">Rec</span>
          </button>
          <button id="gust" class="tool" title="Gust" aria-label="Gust">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 7h10a2.5 2.5 0 1 0-2.5-2.5M2 11h13a2.5 2.5 0 1 1-2.5 2.5M2 15h6"/></svg>
            <span>Gust</span>
          </button>
          <button id="rain" class="tool" title="Rain shower" aria-label="Rain">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3l-2 5M10 3l-2 5M15 3l-2 5M7.5 11l-2 5M12.5 11l-2 5"/></svg>
            <span>Rain</span>
          </button>
          <button id="panic" class="tool" title="Silence everything on the ground" aria-label="Clear the ground">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15h14M6 15l1.5-6h5L14 15M8.5 9V4h3v5"/></svg>
            <span>Clear</span>
          </button>
        </div>
      </div>
    </section>
    <p id="audio-error" class="error" role="alert" hidden></p>
    <section id="takes" class="takes" aria-label="Recordings" hidden></section>

    <section id="grid" class="grid" aria-label="Canopy. Tap a cell to add or remove a leaf. Tap a tree name to edit it."></section>

    <nav class="tabs" role="tablist" aria-label="Settings">
      <button class="tab" role="tab" id="tab-tree" data-tab="tree" aria-controls="panel-tree">Tree</button>
      <button class="tab" role="tab" id="tab-forest" data-tab="forest" aria-controls="panel-forest">Forest</button>
      <button class="tab" role="tab" id="tab-presets" data-tab="presets" aria-controls="panel-presets">Presets</button>
    </nav>
    <section id="panel-tree" class="panel" role="tabpanel" aria-labelledby="tab-tree"></section>
    <section id="panel-forest" class="panel" role="tabpanel" aria-labelledby="tab-forest" hidden></section>
    <section id="panel-presets" class="panel" role="tabpanel" aria-labelledby="tab-presets" hidden></section>

    <footer class="foot">Decay rates are plausible ballparks for temperate leaf litter, tuned for sound rather than fitted to data.</footer>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
