<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F0E6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14130F" media="(prefers-color-scheme: dark)">
  <title>Leaf Fall</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>Leaf Fall</h1>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </header>

  <main class="wrap">
    <div class="scene-wrap">
      <canvas id="scene" role="img" aria-label="Leaves hang from the canopy, fall in the wind and decay on the ground. Tap a leaf to drop it, or tap the sky for a gust."></canvas>
    </div>

    <div class="transport">
      <button id="play" class="primary" aria-pressed="false">Play</button>
      <button id="gust">Gust</button>
      <button id="rain">Rain</button>
      <button id="panic" title="Silence everything on the ground">Clear</button>
    </div>
    <p id="audio-error" class="error" role="alert" hidden></p>

    <div id="grid" class="grid" aria-label="Canopy. Each lit cell holds a leaf."></div>

    <nav class="tabs" role="tablist" aria-label="Settings">
      <button class="tab" role="tab" data-tab="forest" aria-controls="panel-forest">Forest</button>
      <button class="tab" role="tab" data-tab="species" aria-controls="panel-species">Trees</button>
      <button class="tab" role="tab" data-tab="presets" aria-controls="panel-presets">Presets</button>
    </nav>
    <div id="panel-forest" class="panel" role="tabpanel"></div>
    <div id="panel-species" class="panel" role="tabpanel" hidden></div>
    <div id="panel-presets" class="panel" role="tabpanel" hidden></div>

    <footer class="foot">
      <p>Decay rates are plausible ballparks for temperate leaf litter, tuned for sound rather than fitted to data.</p>
    </footer>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
